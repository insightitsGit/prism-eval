name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest tests/test_prism_eval_engine.py -v
      - name: CLI smoke (empty agent must fail closed)
        run: |
          set -e
          set +e
          prism-eval --policy-id ci --corpus builtin --min-pass-rate 0.95 --no-upsell --audit-receipt audit.json --junit out.junit.xml --sarif out.sarif
          code=$?
          set -e
          test "$code" -eq 1
          test -f audit.json
          test -f out.junit.xml
          test -f out.sarif
          python -c "from prism_eval import load_audit_receipt; r=load_audit_receipt('audit.json'); assert r.verify()"
      - name: SBOM script smoke
        run: python scripts/generate_sbom.py /tmp/sbom.cdx.json && test -s /tmp/sbom.cdx.json

  coexistence:
    name: coexist with prismmanifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install prism-eval then gate prismmanifest
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install "prismmanifest>=0.3.4"
      - name: Assert gate package owns prismmanifest
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import prismmanifest
          from pathlib import Path
          ver = md.version("prismmanifest")
          path = Path(prismmanifest.__file__).resolve()
          print("prismmanifest version:", ver)
          print("prismmanifest file:", path)
          assert "site-packages" in path.as_posix()
          PY
      - name: Import PrismEvalEngine beside gate package
        run: |
          python -c "from prism_eval import PrismEvalEngine; print(PrismEvalEngine)"
      - name: Empty-agent CLI fail-closed (exit 1)
        run: |
          set +e
          prism-eval --policy-id ci --corpus builtin --no-upsell
          code=$?
          set -e
          test "$code" -eq 1
      - name: Wheel must not ship prismmanifest
        run: |
          pip install build
          python -m build --wheel -o /tmp/pe-dist
          python - <<'PY'
          import zipfile
          from pathlib import Path
          whl = next(Path("/tmp/pe-dist").glob("*.whl"))
          names = zipfile.ZipFile(whl).namelist()
          bad = [n for n in names if n.startswith("prismmanifest/")]
          assert not bad, f"wheel still contains prismmanifest: {bad[:5]}"
          print("wheel OK:", whl.name)
          PY
