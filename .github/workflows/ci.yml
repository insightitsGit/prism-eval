name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest tests/test_prism_eval_engine.py -v
      - name: CLI smoke (empty agent must fail closed)
        run: |
          set -e
          set +e
          prism-eval --policy-id ci --corpus builtin --min-pass-rate 0.95 --no-upsell --audit-receipt audit.json --junit out.junit.xml --sarif out.sarif
          code=$?
          set -e
          test "$code" -eq 1
          test -f audit.json
          test -f out.junit.xml
          test -f out.sarif
          python -c "from prism_eval import load_audit_receipt; r=load_audit_receipt('audit.json'); assert r.verify()"
      - name: SBOM script smoke
        run: python scripts/generate_sbom.py /tmp/sbom.cdx.json && test -s /tmp/sbom.cdx.json
