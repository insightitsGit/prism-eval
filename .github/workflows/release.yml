name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Generate CycloneDX SBOM
        run: |
          pip install -e .
          python scripts/generate_sbom.py sbom.cdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/
            sbom.cdx.json

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: .
      - name: Create GitHub Release with artifacts + SBOM
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom.cdx.json
          generate_release_notes: true
          body: |
            ## Prism-Eval ${{ github.ref_name }}

            Production/enterprise eval gate for AI agent extractions.

            - Wheels + sdist attached
            - CycloneDX SBOM attached (`sbom.cdx.json`)
            - Build provenance attested via GitHub Actions
            - PyPI: published separately via local `twine` (see docs/PYPI_PUBLISHING.md)

            See CHANGELOG.md for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
