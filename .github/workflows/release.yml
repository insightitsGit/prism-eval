name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI (requires Trusted Publisher or PYPI_API_TOKEN)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Generate CycloneDX SBOM
        run: |
          pip install -e .
          python scripts/generate_sbom.py sbom.cdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/
            sbom.cdx.json

  publish-pypi:
    needs: build
    if: github.event_name == 'push' || inputs.publish_pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/prism-eval
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: .
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Prefer repo secret PYPI_API_TOKEN when present; otherwise OIDC trusted publishing.
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: .
      - name: Create GitHub Release with artifacts + SBOM
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom.cdx.json
          generate_release_notes: true
          body: |
            ## Prism-Eval ${{ github.ref_name }}

            Production/enterprise eval gate for AI agent extractions.

            - Wheels + sdist attached
            - CycloneDX SBOM attached (`sbom.cdx.json`)
            - Build provenance attested via GitHub Actions
            - PyPI publish runs when Trusted Publishing or `PYPI_API_TOKEN` is configured

            See CHANGELOG.md for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
