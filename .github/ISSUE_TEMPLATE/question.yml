name: Question
description: Ask about usage, scoring, or CI integration (not security)
title: "[question]: "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For enterprise / SLA support see [SUPPORT.md](https://github.com/insightitsGit/prism-eval/blob/main/SUPPORT.md) and [InsightITS](https://www.insightits.com).
        Security issues → [private advisory](https://github.com/insightitsGit/prism-eval/security/advisories/new).
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you already tried, relevant CLI flags, Python version
