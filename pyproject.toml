[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-eval"
version = "0.2.1"
description = "Pre-deploy adversarial test suite for AI agent extraction payloads"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Prism-Eval contributors" }]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
demo = [
  "streamlit>=1.32.0",
]

[project.scripts]
prism-eval = "prismmanifest.prism_eval.cli:main"

[tool.setuptools.packages.find]
include = ["prismmanifest*", "prism_eval*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
